name: Build APK (embedded AVNC + TigerVNC)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK packages
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Restore Debian rootfs blob from upstream release APK
        # The 390 MB rootfs blob is git-ignored; extract it from the
        # upstream PIRT v0.2.0 APK so this fork builds offline-capable.
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 -o /tmp/upstream-pirt.apk \
            https://github.com/ZIXT233/PIRT/releases/download/v0.2.0/PIRT-v0.2.0.apk
          BLOB="app/src/main/assets/runtime/debian-13.6.0-base-arm64.blob"
          unzip -p /tmp/upstream-pirt.apk "assets/runtime/debian-13.6.0-base-arm64.blob" > "$BLOB"
          EXPECTED="ac4d582572962f3efb5cd2c0bb1b8bea6321ed5d0bb6361fd8376b61eb5be37a"
          ACTUAL="$(sha256sum "$BLOB" | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED"

      - name: Grant execute permission for Gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PIRT-tigervnc-avnc-debug
          path: app/build/outputs/apk/debug/app-debug.apk
